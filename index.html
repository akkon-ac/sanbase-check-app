<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Wird durch `--base-href` ersetzt, wenn die App nicht im Stammverzeichnis liegt. -->
  <base href="/sanbase-check-app/">

  <meta charset="UTF-8">
  <!-- maximum-scale=1: iOS zoomt sonst beim Antippen eines Felds mit
       kleiner Schrift hinein (die App hat eine eigene Größeneinstellung). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="SanBase Check: Materialprüfung nach Checklisten, offline, die Daten bleiben auf dem Gerät.">
  <meta name="theme-color" content="#00A68B">

  <!-- iOS: als App vom Home-Bildschirm starten -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Check">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>SanBase Check</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; } }
    #laden {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 16px system-ui, sans-serif; color: #888;
    }
    .sb-hinweis {
      position: fixed; left: 12px; right: 12px; z-index: 10000;
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 12px; align-items: center; padding: 12px 16px;
      border-radius: 10px; background: #323232; color: #fff;
      font: 15px system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    .sb-hinweis span { flex: 1; }
    .sb-hinweis button {
      border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
      font: 600 15px system-ui, sans-serif; background: #00A68B; color: #fff;
    }
    .sb-hinweis button.leise { background: transparent; color: #ccc; }
  </style>
</head>
<body>
  <div id="laden">SanBase Check wird geladen …</div>

  <script>
    (function () {
      // Farbe der Statusleiste vom letzten Start (Kopfzeile der Check-DB),
      // damit nicht erst das Standard-Grün erscheint.
      try {
        var farbe = localStorage.getItem('sanbase_check_themafarbe');
        if (/^#[0-9a-fA-F]{6}$/.test(farbe || '')) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', farbe);
        }
      } catch (e) {}

      // iOS zoomt beim Antippen von Feldern mit kleiner Schrift hinein
      // (Bemerkung). Flutter ersetzt den Viewport-Tag beim Start; daher
      // maximum-scale=1 jedes Mal wieder setzen.
      var VIEWPORT = 'width=device-width, initial-scale=1, maximum-scale=1, ' +
        'viewport-fit=cover';
      function viewportFest() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          if (m.getAttribute('content') !== VIEWPORT) m.setAttribute('content', VIEWPORT);
        });
      }
      try {
        new MutationObserver(viewportFest).observe(document.head,
          { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      } catch (e) {}

      function hinweis(text, knopf, aktion, merkenAls) {
        var div = document.createElement('div');
        div.className = 'sb-hinweis';
        var span = document.createElement('span');
        span.textContent = text;
        div.appendChild(span);
        if (knopf) {
          var b = document.createElement('button');
          b.textContent = knopf;
          b.onclick = function () { aktion(); div.remove(); };
          div.appendChild(b);
        }
        var x = document.createElement('button');
        x.className = 'leise';
        x.textContent = '✕';
        x.title = 'Schließen';
        x.onclick = function () {
          div.remove();
          if (merkenAls) { try { localStorage.setItem(merkenAls, '1'); } catch (e) {} }
        };
        div.appendChild(x);
        document.body.appendChild(div);
      }

      // Daten im Browser nicht automatisch löschen lassen.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () {});
      }

      // iOS: Nur als App vom Home-Bildschirm bleiben die Daten dauerhaft erhalten.
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.userAgent.indexOf('Macintosh') >= 0 && navigator.maxTouchPoints > 1);
      var installiert = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      var ausgeblendet = false;
      try { ausgeblendet = localStorage.getItem('sbcheck_ios_hinweis') === '1'; } catch (e) {}
      if (ios && !installiert && !ausgeblendet) {
        window.addEventListener('load', function () {
          hinweis('Für die Offline-Nutzung in Safari „Teilen“ → „Zum Home-Bildschirm“ ' +
            'wählen und SanBase Check von dort starten. Sonst kann Safari die Daten löschen.',
            null, null, 'sbcheck_ios_hinweis');
        });
      }

      // Offline-Betrieb und Updates (sw.js wird von tool/release.ps1 befüllt).
      if ('serviceWorker' in navigator) {
        var neuLaden = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (neuLaden) location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').then(function (reg) {
            function updateAnbieten(sw) {
              hinweis('Eine neue Version von SanBase Check ist verfügbar.', 'Neu laden', function () {
                neuLaden = true;
                sw.postMessage('aktivieren');
              });
            }
            if (reg.waiting && navigator.serviceWorker.controller) updateAnbieten(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var sw = reg.installing;
              sw.addEventListener('statechange', function () {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  updateAnbieten(sw);
                }
              });
            });
            // Lange geöffnete App: stündlich nach Updates sehen.
            setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
            // Von Hand nach einem Update sehen (Einstellungen der App):
            // 'neu' (Hinweis „Neu laden“ erscheint) oder 'aktuell'.
            window.sanbaseUpdatePruefen = function () {
              return reg.update().then(function () {
                var sw = reg.waiting || reg.installing;
                if (!sw) return 'aktuell';
                if (reg.waiting && navigator.serviceWorker.controller) {
                  updateAnbieten(reg.waiting);
                }
                return 'neu';
              }).catch(function () { return 'nicht'; });
            };
          }).catch(function () {});
        });
      }
    })();
  </script>
  <script>
    // Fokus-Protokoll (Fehlersuche): kleine Einblendung oben mit Fokus-,
    // Zeiger- und Tastatur-Ereignissen. Ein/aus über die Anzeige-Einstellungen.
    (function () {
      var an = false, kasten = null, zeilen = [], start = Date.now();
      function name(el) {
        if (!el) return '-';
        if (el.id === 'sb-tastatur-halter') return 'halter';
        if (el.classList && el.classList.contains('flt-text-editing')) {
          return el.tagName.toLowerCase() + '(' + (el.getAttribute('inputmode') || 'text') + ')';
        }
        return el.tagName ? el.tagName.toLowerCase() : String(el);
      }
      function log(text) {
        if (!an) return;
        zeilen.push(((Date.now() - start) % 100000) + ' ' + text);
        if (zeilen.length > 14) zeilen.shift();
        if (kasten) kasten.textContent = zeilen.join('\n');
      }
      window.sanbaseFokusLogEintrag = log;
      window.sanbaseFokusLogAn = function () { return an; };
      window.sanbaseFokusLog = function (neu) {
        an = !!neu;
        try { localStorage.setItem('sb_fokuslog', an ? '1' : '0'); } catch (e) {}
        if (an && !kasten) {
          kasten = document.createElement('div');
          kasten.id = 'sb-fokuslog';
          kasten.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0);left:0;' +
            'right:0;z-index:2147483647;pointer-events:none;white-space:pre;' +
            'font:10px/1.25 monospace;color:#fff;background:rgba(0,0,0,.7);padding:2px 4px;';
          document.body.appendChild(kasten);
          log('Protokoll an');
        } else if (!an && kasten) {
          kasten.remove();
          kasten = null;
          zeilen = [];
        }
      };
      ['pointerdown', 'pointerup', 'touchstart', 'touchend'].forEach(function (t) {
        document.addEventListener(t, function (e) { log(t + ' ' + name(e.target)); }, true);
      });
      document.addEventListener('focusin', function (e) { log('focusin ' + name(e.target)); }, true);
      document.addEventListener('focusout', function (e) {
        log('focusout ' + name(e.target) + ' -> ' + name(e.relatedTarget));
      }, true);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          log('viewport h=' + Math.round(window.visualViewport.height));
        });
      }
      try {
        if (localStorage.getItem('sb_fokuslog') === '1') {
          if (document.body) window.sanbaseFokusLog(true);
          else document.addEventListener('DOMContentLoaded', function () { window.sanbaseFokusLog(true); });
        }
      } catch (e) {}
    })();

    // iOS: Flutter legt pro Textfeld ein eigenes verstecktes <input> an. Beim
    // Wechsel nimmt die Engine dem alten Feld den Fokus, indem sie ihn kurz auf
    // die Flutter-Ansicht legt – dann ist kein Eingabefeld fokussiert und iOS
    // klappt die Tastatur zu. Ein unsichtbarer „Halter“ übernimmt in diesem
    // Moment den Fokus, bis das neue Feld ihn holt (sonst gibt er ihn nach
    // 300 ms ab und die Tastatur schließt wie gewohnt).
    (function () {
      try {
        var ua = navigator.userAgent;
        var ios = /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!ios) return;
        var log = function (t) { if (window.sanbaseFokusLogEintrag) window.sanbaseFokusLogEintrag(t); };
        var halter = null, uhr = null;
        var fokus = HTMLElement.prototype.focus;
        function istFeld(el) {
          return !!(el && el.classList && el.classList.contains('flt-text-editing'));
        }
        function holeHalter(ansicht) {
          if (!halter) {
            halter = document.createElement('input');
            halter.id = 'sb-tastatur-halter';
            halter.setAttribute('tabindex', '-1');
            halter.setAttribute('aria-hidden', 'true');
            halter.setAttribute('autocomplete', 'off');
            halter.style.cssText = 'position:absolute;top:0;left:0;width:1px;' +
              'height:1px;opacity:0;border:0;padding:0;margin:0;' +
              'font-size:16px;caret-color:transparent;background:transparent;';
          }
          var host = ansicht.querySelector('flt-text-editing-host') || ansicht;
          if (halter.parentNode !== host) host.appendChild(halter);
          return halter;
        }
        HTMLElement.prototype.focus = function () {
          try {
            var alt = document.activeElement;
            if (this.tagName === 'FLUTTER-VIEW' && istFeld(alt)) {
              var h = holeHalter(this);
              h.setAttribute('inputmode', alt.getAttribute('inputmode') || 'text');
              fokus.call(h, { preventScroll: true });
              if (document.activeElement === h) {
                log('halter übernimmt');
                if (uhr) clearTimeout(uhr);
                uhr = setTimeout(function () {
                  uhr = null;
                  if (document.activeElement === halter) {
                    log('halter gibt ab');
                    halter.blur();
                  }
                }, 300);
                return;
              }
            }
          } catch (e) {}
          return fokus.apply(this, arguments);
        };
        document.addEventListener('focusin', function (e) {
          if (istFeld(e.target) && uhr) { clearTimeout(uhr); uhr = null; }
        }, true);
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
